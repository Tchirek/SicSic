name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: embed/package-lock.json

      - name: Install embed dependencies
        working-directory: embed
        run: npm ci

      - name: Check embed package
        working-directory: embed
        run: npm run check

      - name: Test anonymous identity boundaries
        working-directory: embed
        run: npm test

      - name: Build embed package
        working-directory: embed
        run: npm run build

      - name: Check bundle and source archive budgets
        working-directory: embed
        run: npm run test:budget

      - name: Audit hardening
        run: npm run audit:hardening -- embed

      - name: Audit public export
        run: npm run audit:public-export -- .
